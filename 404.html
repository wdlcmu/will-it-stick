<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found — Will It Stick?</title>
<meta name="description" content="That page is not here. The checker is on the home page.">
<meta name="robots" content="noindex">
<style>
  body{margin:0;background:#faf6ee;color:#221d15;font-family:Georgia,'Times New Roman',serif;line-height:1.5}
  .wrap{max-width:700px;margin:0 auto;padding:28px 16px 48px}
  h1{font-size:34px;margin:0 0 14px}
  p{font-size:17px}
  a{color:#b97e0e}

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>That page is not here.</h1>
  <p>The link may be old, or the address may have a typo.</p>
  <p><a href="/">Go to Will It Stick?</a> — paste your words and see what sticks.</p>
  <p>Built with Muse.</p>
</div>
</body>
</html>
